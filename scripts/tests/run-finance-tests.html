<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Testes financeiros - Imovel Toolkit</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #f7faf9;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 920px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #dce5e2;
        border-radius: 8px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        padding: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
      }

      p {
        margin: 0 0 20px;
        color: #64748b;
      }

      .summary {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 800;
      }

      .summary.passed {
        background: #e5f4f2;
        color: #0f766e;
      }

      .summary.failed {
        background: #fee2e2;
        color: #b91c1c;
      }

      ul {
        list-style: none;
        display: grid;
        gap: 10px;
        padding: 0;
        margin: 20px 0 0;
      }

      li {
        border: 1px solid #dce5e2;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
      }

      li strong {
        display: block;
        margin-bottom: 4px;
      }

      li.passed strong {
        color: #0f766e;
      }

      li.failed strong {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Testes financeiros</h1>
      <p>Validação automática de SAC, PRICE, aportes, FGTS, entrada, renda e evolução de obra.</p>
      <div id="summary" class="summary">Executando...</div>
      <ul id="results"></ul>
    </main>

    <script type="module">
      import { runFinanceTests } from "./finance-cases.js";

      const results = runFinanceTests();
      const failed = results.filter((result) => result.status === "failed");
      const summary = document.getElementById("summary");
      const list = document.getElementById("results");

      summary.textContent = failed.length === 0
        ? `${results.length} testes passaram`
        : `${failed.length} de ${results.length} testes falharam`;
      summary.classList.add(failed.length === 0 ? "passed" : "failed");

      list.innerHTML = results.map((result) => `
        <li class="${result.status}">
          <strong>${result.status === "passed" ? "OK" : "Falha"} - ${result.name}</strong>
          <span>${result.message || "Valores conferidos com sucesso."}</span>
        </li>
      `).join("");
    </script>
  </body>
</html>
